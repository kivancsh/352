<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8f4e"/>
      <stop offset="1" stop-color="#0b4d2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="512" height="64" patternUnits="userSpaceOnUse">
      <rect width="512" height="32" fill="#000" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="ballClip"><circle r="46"/></clipPath>
  </defs>

  <!-- Saha zemini -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#stripes)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Saha çizgileri -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6">
    <rect x="60" y="44" width="392" height="424" rx="6"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <circle cx="256" cy="256" r="62"/>
    <rect x="166" y="44" width="180" height="70"/>
    <rect x="166" y="398" width="180" height="70"/>
  </g>

  <!-- 3-5-2 dizilişi: 2 forvet, 5 orta saha (ortadaki top), 3 defans, kaleci -->
  <g fill="#ffffff">
    <circle cx="206" cy="112" r="20"/>
    <circle cx="306" cy="112" r="20"/>
    <circle cx="104" cy="214" r="20"/>
    <circle cx="166" cy="262" r="20"/>
    <circle cx="346" cy="262" r="20"/>
    <circle cx="408" cy="214" r="20"/>
    <circle cx="164" cy="366" r="20"/>
    <circle cx="256" cy="378" r="20"/>
    <circle cx="348" cy="366" r="20"/>
  </g>
  <circle cx="256" cy="446" r="18" fill="#ffd24a"/>

  <!-- Futbol topu -->
  <g transform="translate(256 256)">
    <circle r="46" fill="#ffffff"/>
    <g clip-path="url(#ballClip)" fill="#0b1410">
      <polygon points="0,-16 15.2,-4.9 9.4,12.9 -9.4,12.9 -15.2,-4.9"/>
      <g stroke="#0b1410" stroke-width="3">
        <line x1="0" y1="-16" x2="0" y2="-34"/>
        <line x1="15.2" y1="-4.9" x2="32.3" y2="-10.5"/>
        <line x1="9.4" y1="12.9" x2="20" y2="27.5"/>
        <line x1="-9.4" y1="12.9" x2="-20" y2="27.5"/>
        <line x1="-15.2" y1="-4.9" x2="-32.3" y2="-10.5"/>
      </g>
      <polygon points="0,-34 13,-44 8,-60 -8,-60 -13,-44"/>
      <polygon points="0,-34 13,-44 8,-60 -8,-60 -13,-44" transform="rotate(72)"/>
      <polygon points="0,-34 13,-44 8,-60 -8,-60 -13,-44" transform="rotate(144)"/>
      <polygon points="0,-34 13,-44 8,-60 -8,-60 -13,-44" transform="rotate(216)"/>
      <polygon points="0,-34 13,-44 8,-60 -8,-60 -13,-44" transform="rotate(288)"/>
    </g>
    <circle r="46" fill="none" stroke="#0b1410" stroke-width="5"/>
  </g>
</svg>
